<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="title desc">
<title id="title">Farol do Método FAROL — animação vetorial em alta definição</title><desc id="desc">Farol iluminado sobre rochedos ao anoitecer, com mar animado e feixes de luz que varrem o horizonte.</desc>
<defs>
<linearGradient id="sky" x2=".15" y2="1"><stop stop-color="#061326"/><stop offset=".52" stop-color="#173852"/><stop offset="1" stop-color="#d39365"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#ffe9ac" stop-opacity=".48"/><stop offset="1" stop-color="#f1c778" stop-opacity="0"/></radialGradient>
<linearGradient id="sea" x2=".2" y2="1"><stop stop-color="#143c53"/><stop offset="1" stop-color="#031a2e"/></linearGradient>
<linearGradient id="tower" x2="1" y2=".25"><stop stop-color="#a5adb3"/><stop offset=".35" stop-color="#f7e8d3"/><stop offset=".74" stop-color="#dfd4c6"/><stop offset="1" stop-color="#677c8b"/></linearGradient>
<linearGradient id="beam"><stop stop-color="#fff1b7" stop-opacity="0"/><stop offset=".4" stop-color="#ffe4a0" stop-opacity=".18"/><stop offset="1" stop-color="#fff6d8" stop-opacity=".01"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="17"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="foam" width="340" height="110" patternUnits="userSpaceOnUse"><path d="M-35 60Q42 26 115 52T265 54T380 38" fill="none" stroke="#8dc8d1" stroke-opacity=".19" stroke-width="4"/><path d="M-30 86Q36 67 104 77T245 82T380 69" fill="none" stroke="#fff1cb" stroke-opacity=".12" stroke-width="2"/></pattern>
</defs>
<rect width="1600" height="1200" fill="url(#sky)"/>
<g fill="#f7e7c2" opacity=".75"><circle cx="145" cy="145" r="2"/><circle cx="287" cy="240" r="2"/><circle cx="460" cy="103" r="1.8"/><circle cx="1039" cy="107" r="2"/><circle cx="1284" cy="224" r="2"/><circle cx="1480" cy="110" r="2"/></g>
<path d="M0 690Q240 610 450 667T850 665T1250 638T1600 680V1200H0Z" fill="#1d4055" opacity=".33"/>
<rect y="695" width="1600" height="505" fill="url(#sea)"/>
<g opacity=".65"><path d="M0 770Q240 730 460 772T900 766T1600 757" stroke="#eebf89" stroke-width="4" fill="none" opacity=".4"/><path d="M0 800Q320 760 630 809T1210 790T1600 808" stroke="#d4e2dc" stroke-width="3" fill="none" opacity=".25"/></g>
<!-- moving soft surf layers -->
<g><rect x="-340" y="775" width="2400" height="430" fill="url(#foam)"><animateTransform attributeName="transform" type="translate" values="0 0;-340 6;0 0" dur="8s" repeatCount="indefinite"/></rect></g>
<g><path d="M0 950Q160 907 350 960T720 946T1040 960T1600 930V1200H0Z" fill="#103047" opacity=".75"><animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 950Q160 907 350 960T720 946T1040 960T1600 930V1200H0Z;M0 940Q160 974 350 939T720 967T1040 937T1600 952V1200H0Z;M0 950Q160 907 350 960T720 946T1040 960T1600 930V1200H0Z"/></path></g>
<!-- rock base -->
<path d="M320 1000 405 921 475 898 530 817 600 853 668 800 760 847 850 803 940 850 1000 940 1135 1000 1256 1080 1080 1160H440L262 1082Z" fill="#0d2733"/>
<path d="M375 1007 488 905 535 839 610 881 685 826 752 880 841 833 924 893 1008 982 935 964 855 1009 769 974 660 1026 537 980Z" fill="#29414a"/>
<path d="M420 972 525 850 577 888 676 843 740 881 849 846 903 880" stroke="#65746a" stroke-width="9" opacity=".28" fill="none"/>
<!-- lighthouse cast shadow -->
<ellipse cx="782" cy="909" rx="176" ry="48" fill="#071923" opacity=".72"/>
<!-- tower -->
<path d="M712 399H847L892 895H664Z" fill="url(#tower)" stroke="#e1e3d9" stroke-width="4"/>
<path d="M729 410H758L745 890H691Z" fill="#fff6e5" opacity=".28"/>
<path d="M806 411 848 412 885 891 846 887Z" fill="#142f45" opacity=".2"/>
<path d="M699 594H861L866 659H693Z" fill="#b14342"/>
<path d="M682 793H880L886 825H678Z" fill="#b14342"/>
<path d="M748 734Q778 714 809 734V888H748Z" fill="#19384b" stroke="#e4d3b5" stroke-width="7"/>
<path d="M754 762H801M775 739V885" stroke="#6b858b" stroke-width="3"/>
<g fill="#f4d698" stroke="#c4a96d" stroke-width="5"><rect x="759" y="464" width="43" height="67" rx="19"/><rect x="762" y="675" width="42" height="58" rx="18"/></g>
<!-- lantern gallery -->
<path d="M660 404H897L910 418H648Z" fill="#243b47"/>
<path d="M670 320H887V400H670Z" fill="#253b4b" stroke="#e9ddbc" stroke-width="8"/>
<rect x="688" y="334" width="180" height="55" fill="#ffde8a"/>
<rect x="705" y="334" width="145" height="55" fill="#fff7c5" opacity=".8"/>
<g stroke="#283c47" stroke-width="12"><path d="M724 326V396M779 326V396M832 326V396"/></g>
<path d="M665 315 778 239 892 315Z" fill="#a43f3a" stroke="#e8c9a8" stroke-width="8"/>
<path d="M779 241V209" stroke="#f2dac0" stroke-width="9"/><circle cx="779" cy="202" r="10" fill="#efd49a"/>
<!-- rotating light beams anchored at lamp -->
<g transform-origin="778px 354px"><g><path d="M778 354 1590 47 1600 658Z" fill="url(#beam)"/><path d="M778 354 -140 112 -150 670Z" fill="url(#beam)" opacity=".68"/><animateTransform attributeName="transform" type="rotate" from="0 778 354" to="360 778 354" dur="13s" repeatCount="indefinite"/></g></g>
<circle cx="778" cy="354" r="165" fill="url(#halo)"><animate attributeName="opacity" values=".75;1;.75" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="778" cy="354" r="41" fill="#fff1b8" opacity=".73" filter="url(#glow)"/>
<circle cx="778" cy="354" r="18" fill="#fff9e0"/>
<!-- gold reflections in ocean -->
<g stroke="#f2c27b" stroke-linecap="round" opacity=".55"><path d="M764 1029h47M744 1054h83M733 1085h111M761 1115h62M711 1149h145" stroke-width="5"><animate attributeName="opacity" values=".15;.68;.22" dur="4s" repeatCount="indefinite"/></path></g>
<path d="M0 1134Q280 1092 513 1142T1010 1140T1600 1129" stroke="#b5d7d8" stroke-opacity=".25" stroke-width="10" fill="none"/>
</svg>